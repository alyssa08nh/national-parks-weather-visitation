project:
  type: website
  output-dir: _site

website:
  title: "Field Notes: Parks & Weather"
  description: "A data story about weather, seasons, and national park visitation."
  navbar:
    background: "#132d2b"
    foreground: "#f8f4e9"
    left:
      - text: "Field Notes"
        href: index.qmd
      - text: "Exploration"
        href: exploration.qmd
      - text: "Story"
        href: story.qmd
    right:
      - icon: github
        href: https://github.com/
        aria-label: GitHub
  page-footer:
    left: "National Parks Weather Visitation"
    right: "Built with Quarto + R"

format:
  html:
    theme: [cosmo, styles.css]
    toc: false
    code-fold: true
    smooth-scroll: true
    fig-width: 12
    fig-height: 6
    html-math-method: plain